<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThreadScope Dashboard</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --green:    #3fb950;
      --red:      #f85149;
      --yellow:   #d29922;
      --blue:     #58a6ff;
      --purple:   #bc8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", sans-serif; font-size: 14px; }

    /* ── layout ── */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .topbar h1 { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
    .topbar h1 span { color: var(--purple); }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .badge.on  { background: #1a3a1a; color: var(--green); }
    .badge.off { background: #2d1b1b; color: var(--red); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.off { background: var(--red); }

    .wrapper { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr; gap: 0; height: calc(100vh - 53px); }

    /* ── sidebar ── */
    .sidebar { border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 12px; }

    .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
    .stat-row .label { color: var(--muted); font-size: 12px; }
    .stat-row .value { font-weight: 600; font-size: 13px; }
    .stat-row .value.green { color: var(--green); }
    .stat-row .value.red   { color: var(--red); }
    .stat-row .value.blue  { color: var(--blue); }

    .btn { display: block; width: 100%; padding: 9px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; text-align: center; }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-start { background: var(--green); color: #0d1117; }
    .btn-stop  { background: var(--red);   color: #fff; }
    .btn-gap   { margin-top: 8px; }

    /* ── main area ── */
    .main { display: grid; grid-template-rows: 1fr 280px; overflow: hidden; }

    /* ── terminal ── */
    .terminal-wrap { display: flex; flex-direction: column; overflow: hidden; border-bottom: 1px solid var(--border); }
    .pane-header { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
    .pane-header span { cursor: pointer; color: var(--blue); font-size: 11px; }
    #terminal { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 12px; line-height: 1.65; background: #0a0e14; }
    #terminal .line { white-space: pre-wrap; word-break: break-all; }
    #terminal .line.info    { color: #79c0ff; }
    #terminal .line.debug   { color: var(--muted); }
    #terminal .line.filter  { color: var(--yellow); }
    #terminal .line.draf    { color: var(--green); font-weight: 600; }
    #terminal .line.success { color: var(--green); }
    #terminal .line.error   { color: var(--red); }
    #terminal .line.default { color: #b1bac4; }

    /* ── comments ── */
    .comments-wrap { overflow: hidden; display: flex; flex-direction: column; }
    #comments-list { flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
    .comment-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
    .comment-card .cap { font-size: 11px; color: var(--muted); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .comment-card .rep { font-size: 13px; color: var(--text); line-height: 1.5; }
    .comment-card .ts  { font-size: 10px; color: var(--border); margin-top: 5px; }

    .empty { color: var(--muted); font-size: 12px; padding: 16px; text-align: center; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="dot" id="dot"></div>
  <h1>Thread<span>Scope</span></h1>
  <div class="badge off" id="status-badge">Stopped</div>
</div>

<div class="wrapper">

  <!-- sidebar -->
  <aside class="sidebar">

    <!-- kontrol -->
    <div class="card">
      <h3>Kontrol Bot</h3>
      <button class="btn btn-start" id="btn-start" onclick="startBot()">Jalankan Bot</button>
      <button class="btn btn-stop btn-gap" id="btn-stop" onclick="stopBot()" disabled>Hentikan Bot</button>
    </div>

    <!-- stats -->
    <div class="card">
      <h3>Statistik</h3>
      <div class="stat-row"><span class="label">Komentar Terkirim</span><span class="value green" id="s-sent">—</span></div>
      <div class="stat-row"><span class="label">Gagal Kirim</span><span class="value red" id="s-fail">—</span></div>
      <div class="stat-row"><span class="label">LLM Error</span><span class="value red" id="s-llmerr">—</span></div>
      <div class="stat-row"><span class="label">Komentar Terakhir</span><span class="value blue" id="s-lastcmt" style="font-size:11px">—</span></div>
      <div class="stat-row"><span class="label">Mulai Sistem</span><span class="value" id="s-start" style="font-size:11px;color:var(--muted)">—</span></div>
    </div>

    <!-- mode -->
    <div class="card">
      <h3>Mode</h3>
      <div class="stat-row"><span class="label">APP_MODE</span><span class="value blue" id="s-mode">—</span></div>
      <div style="margin-top:10px;font-size:11px;color:var(--muted);line-height:1.6">
        Filter aktif:<br>
        ✓ Hanya IT &amp; AI<br>
        ✓ Skip lowongan kerja<br>
        ✓ Post ≤ 5 jam lalu
      </div>
    </div>

  </aside>

  <!-- konten utama -->
  <div class="main">

    <!-- terminal log -->
    <div class="terminal-wrap">
      <div class="pane-header">
        Live Log
        <span onclick="clearTerminal()">Bersihkan</span>
      </div>
      <div id="terminal"><span class="line default">Menunggu koneksi log…</span></div>
    </div>

    <!-- riwayat komentar -->
    <div class="comments-wrap">
      <div class="pane-header">Riwayat Komentar (Cache)</div>
      <div id="comments-list"><p class="empty">Memuat…</p></div>
    </div>

  </div>
</div>

<script>
// ── utils ──────────────────────────────────────────────────────────────────
function fmtTs(unix) {
  if (!unix) return '';
  const d = new Date(unix * 1000);
  return d.toLocaleString('id-ID', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'});
}

function classifyLine(line) {
  const l = line.toLowerCase();
  if (l.includes('berhasil') || l.includes('status pengiriman')) return 'success';
  if (l.includes('[filter]')) return 'filter';
  if (l.includes('draf ai:'))  return 'draf';
  if (l.includes('[info]') || l.includes('[session]')) return 'info';
  if (l.includes('[debug]') || l.includes('router debug') || l.includes('final debug')) return 'debug';
  if (l.includes('error') || l.includes('gagal') || l.includes('[error]')) return 'error';
  return 'default';
}

// ── status polling ─────────────────────────────────────────────────────────
async function fetchStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();

    const running = d.running;
    document.getElementById('dot').className = 'dot ' + (running ? 'on' : 'off');
    const badge = document.getElementById('status-badge');
    badge.className = 'badge ' + (running ? 'on' : 'off');
    badge.textContent = running ? 'Running' : 'Stopped';

    document.getElementById('btn-start').disabled = running;
    document.getElementById('btn-stop').disabled  = !running;

    const s = d.stats || {};
    document.getElementById('s-sent').textContent   = s.comments_sent   ?? '—';
    document.getElementById('s-fail').textContent   = s.comment_failures ?? '—';
    document.getElementById('s-llmerr').textContent = s.llm_errors       ?? '—';
    document.getElementById('s-lastcmt').textContent = s.last_comment_time || '—';
    document.getElementById('s-start').textContent  = s.system_start_time || '—';
  } catch(e) {}
}

// ── APP_MODE dari env (tidak terbaca server-side, tapi bisa dari status) ──
async function fetchMode() {
  try {
    const r = await fetch('/api/mode');
    const d = await r.json();
    document.getElementById('s-mode').textContent = d.mode || 'normal';
  } catch {
    document.getElementById('s-mode').textContent = 'normal';
  }
}

// ── bot controls ───────────────────────────────────────────────────────────
async function startBot() {
  document.getElementById('btn-start').disabled = true;
  await fetch('/api/bot/start', {method:'POST'});
  fetchStatus();
}

async function stopBot() {
  document.getElementById('btn-stop').disabled = true;
  await fetch('/api/bot/stop', {method:'POST'});
  fetchStatus();
}

// ── SSE log stream ─────────────────────────────────────────────────────────
const term = document.getElementById('terminal');
let autoScroll = true;

term.addEventListener('scroll', () => {
  autoScroll = term.scrollTop + term.clientHeight >= term.scrollHeight - 30;
});

function clearTerminal() {
  term.innerHTML = '';
}

function appendLine(text) {
  if (!text.trim()) return;
  const div = document.createElement('div');
  div.className = 'line ' + classifyLine(text);
  div.textContent = text;
  term.appendChild(div);
  if (autoScroll) term.scrollTop = term.scrollHeight;
  // Batasi 800 baris supaya tidak berat
  while (term.children.length > 800) term.removeChild(term.firstChild);
}

function connectSSE() {
  term.innerHTML = '';
  const es = new EventSource('/api/logs');
  es.onmessage = e => appendLine(e.data);
  es.onerror   = () => {
    appendLine('[UI] Koneksi log terputus, menyambung ulang…');
    es.close();
    setTimeout(connectSSE, 3000);
  };
}

// ── comments ───────────────────────────────────────────────────────────────
async function loadComments() {
  try {
    const r = await fetch('/api/comments');
    const items = await r.json();
    const el = document.getElementById('comments-list');
    if (!items.length) { el.innerHTML = '<p class="empty">Belum ada komentar tersimpan.</p>'; return; }
    el.innerHTML = items.map(it => `
      <div class="comment-card">
        <div class="cap">📌 ${it.caption.replace(/</g,'&lt;').substring(0,90)}…</div>
        <div class="rep">${it.reply.replace(/</g,'&lt;')}</div>
        <div class="ts">${fmtTs(it.ts)}</div>
      </div>`).join('');
  } catch(e) {}
}

// ── init ───────────────────────────────────────────────────────────────────
connectSSE();
fetchStatus();
loadComments();
setInterval(fetchStatus,   5000);
setInterval(loadComments, 15000);
</script>
</body>
</html>
